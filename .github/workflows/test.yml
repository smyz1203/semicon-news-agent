# PR을 올리거나 main에 코드가 들어올 때 테스트 실행
name: 테스트

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # Vercel 배포에 쓰는 빌드 스크립트가 리눅스에서 그대로 동작하는지 확인
  vercel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/vercel-build.sh
      - name: 결과 확인
        run: test -f _site/index.html && test -f _site/data/issues.json && test -f _site/data/meta.json
