# ── 관련성 키워드 (일반 매체 RSS에서 이 단어가 하나도 없으면 버림) ─────
keywords:
  ko: [반도체, 메모리, D램, 디램, 낸드, 파운드리, 웨이퍼, 시스템반도체, 비메모리, AI칩, AI 칩, 패키징, 후공정,
       노광, 식각, 증착, 소부장, 디스플레이, 올레드, 패널, 마이크로LED, 마이크로 LED, 퀀텀닷, 폴더블, 칩스법]
  en: [semiconductor, chip, foundry, wafer, DRAM, NAND, HBM, lithography, EUV, packaging, display, OLED, LCD,
       microLED, panel]
  # 제목에 이 기업 이름이 있으면 키워드가 없어도 관련 기사로 봄 (아래 '기업 이름 사전'의 대표 이름, 별칭도 인식)
