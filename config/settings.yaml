# 뉴스 Agent 설정 파일
# 이 파일만 고쳐도 Agent의 동작(모델, 비용 한도, 분류 기준, 중요도 기준)을 바꿀 수 있습니다.

# 이 프로젝트의 GitHub 저장소 (웹페이지의 '지금 업데이트' 버튼이 실행을 요청하는 곳)
github_repo: smyz1203/semicon-news-agent

# ── AI 제공사와 모델 ──────────────────────────────────────
# provider를 openai 또는 claude로 바꾸면 그 제공사를 씀.
# API 키는 제공사마다 다른 이름으로 넣음: openai → OPENAI_API_KEY, claude → ANTHROPIC_API_KEY
provider: openai

openai:
  # 주의: OpenAI 공지상 gpt-4o-mini는 2027-01-14 종료 예정 (대체 모델: gpt-6-luna).
  # 종료되면 실행 시 'API 키 또는 모델 설정 문제' 경고가 오므로, 아래 세 줄을 다른 모델 값으로 바꾸면 됨.
  model: gpt-4o-mini
  reasoning: false         # 추론(reasoning) 모델이면 true → 아래 effort를 사용. gpt-4o-mini 같은 일반 모델은 false
  # 추정 비용 계산용 단가 (USD / 100만 토큰). 모델을 바꾸면 이 값도 바꿔야 비용이 맞게 나옴
  #   gpt-4o-mini: {input: 0.15, cache_read: 0.075, output: 0.60}               (reasoning: false)
  #   gpt-6-luna:  {input: 0.10, cache_read: 0.01, cache_write: 0.125, output: 0.50}   (reasoning: true)
  #   gpt-6.1-sol: {input: 2.0, cache_read: 0.10, cache_write: 2.5, output: 10.0}      (reasoning: true)
  pricing_per_mtok: {input: 0.15, cache_read: 0.075, output: 0.60}

claude:
  model: claude-sonnet-5-5
  server_fallback: true    # 요청이 거절되면 서버가 다른 모델로 자동 재시도
  pricing_per_mtok: {input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.2}

# effort: AI가 얼마나 깊게 생각할지 (low / medium / high). 높을수록 비싸고 느림.
effort:
  cluster: low      # 같은 이슈끼리 묶기·분류
  summarize: low    # 요약·사건 분류 (중요도 점수는 코드가 계산)

# ── 한도 (비용 폭주 방지) ─────────────────────────────────
limits:
  max_articles_per_run: 80     # 1차 거르기 후 AI에 넘길 최대 기사 묶음 수
  max_summaries_per_run: 30    # 한 번 실행에서 요약할 최대 이슈 수
  cluster_max_tokens: 8000     # 묶기 호출 1회의 최대 출력 토큰
  summarize_max_tokens: 4000   # 요약 호출 1회의 최대 출력 토큰
  summary_input_chars: 1500    # 요약에 넘길 기사 1건당 최대 글자 수
  summary_articles_per_issue: 4
  summary_max_attempts: 3      # 요약이 이 횟수만큼 실패한 이슈는 더 시도하지 않음
  ai_time_budget_minutes: 15   # 한 번 실행에서 AI 호출에 쓸 최대 시간 (넘으면 나머지는 다음 실행으로)
  ai_request_timeout_seconds: 90

# ── 수집 기간 ─────────────────────────────────────────────
# 매번 최근 48시간 기사를 모두 보고, 이미 처리한 기사(seen)만 건너뜀.
# 그래서 실행이 늦거나 매체가 잠시 실패해도, 상한 때문에 미룬 기사도 다음 실행에서 처리됨.
lookback:
  max_age_hours: 48

# ── 보관 기간 ─────────────────────────────────────────────
retention:
  issues_days: 30          # 웹에 보여줄 기간. 지나면 data/archive로 이동
  active_issue_hours: 72   # 새 기사를 붙일 수 있는 "진행 중" 이슈 기간
  seen_url_days: 14        # 이미 본 URL 기억 기간
  runs_keep: 100           # 실행 기록 보관 개수

# ── 1차 중복 거르기 ───────────────────────────────────────
dedupe:
  title_similarity: 0.6    # 제목 글자 유사도(0~1). 이 이상이고 회사가 같으면 같은 기사로 봄
  max_hours_apart: 48

# ── 분류 ──────────────────────────────────────────────────
categories:
  - 메모리
  - 파운드리/시스템반도체
  - AI반도체
  - 장비/소재/부품
  - 디스플레이
  - 정책/무역
  - 실적/투자/시장

# ── 중요도 기준 ──────────────────────────────────────────
# AI는 점수를 매기지 않고, 이슈의 사건 유형·직접 당사자 기업·확정 여부만 고른다.
# 점수는 코드(agent/score.py)가 이 표로 계산한다:
#   중요도 = 사건 유형 기본점 + 가감점 → 1~5점으로 맞춤 (5를 넘으면 5, 1보다 작으면 1)
# 웹의 '판단 근거'에 계산식이 그대로 나온다. 숫자를 고치면 다음 실행에서 기존 이슈 점수도 다시 계산된다.
importance:
  # 사건 유형별 기본점. AI에게는 name과 desc만 보여주고 점수는 보여주지 않는다.
  # name을 바꾸거나 유형을 추가·삭제하면, 기존 이슈는 다음 실행에서 AI가 다시 분류한다.
  event_types:
    - {name: 신제품·신기술·양산, score: 5, desc: "기업이 새 제품·기술·공정을 출시·공개·개발했거나 차세대 제품 양산을 시작함 (HBM 신세대, 2나노 공정, 8.6세대 OLED 등). 품질 인증·표준·검증 협력은 업계 일반"}
    - {name: 정책·규제·법, score: 4, desc: "중앙정부·의회 차원의 정책 결정, 수출 규제·관세·보조금, 반도체 관련 법 제정·개정·시행. 지자체·지역 사업은 지역·인프라, 기업의 인증·표준은 업계 일반"}
    - {name: 실적, score: 3, desc: "기업이 직접 발표한 분기·연간 실적 (잠정 실적 포함). 증권가·언론의 실적 추정은 시장 전망·통계"}
    - {name: 가격 동향, score: 3, desc: "메모리·패널 등 제품 가격의 오르내림"}
    - {name: 설비 투자, score: 3, desc: "공장·생산라인 신설·증설·철수, 생산능력 확대·축소"}
    - {name: 수주·공급, score: 3, desc: "수주, 공급 계약, 고객사 확보·납품"}
    - {name: 경영진 교체, score: 3, desc: "대표이사·사업부장 등 경영진 교체, 정기 임원 인사, 조직 개편"}
    - {name: 소송·특허, score: 3, desc: "소송, 특허 분쟁, 경쟁 당국의 조사·과징금"}
    - {name: 인수합병, score: 2, desc: "기업 인수·합병, 지분 인수·매각, 사업 분할. 상장(IPO)·배당은 재무·주주"}
    - {name: 지역·인프라, score: 2, desc: "지자체·지역의 산업단지·클러스터·생태계 사업, 전력·용수·송전망 등 인프라, 지역 주민 반대"}
    - {name: 채용·인력, score: 2, desc: "채용, 인재 양성, 교육 기관·과정. 임원 인사는 경영진 교체"}
    - {name: 시장 전망·통계, score: 2, desc: "시장조사기관·증권가의 전망과 추정, 점유율·출하량·수출입 통계"}
    - {name: 재무·주주, score: 2, desc: "배당, 자사주, 상장(IPO), 투자 유치"}
    - {name: 업계 일반, score: 2, desc: "다른 유형에 맞지 않는 업계 동향, 품질 인증·표준, 전시회·행사, 업무협약(MOU)·공동 연구"}
    - {name: 홍보·수상, score: 1, desc: "홍보성 기사, 수상, 기업 광고·사회공헌"}
    - {name: 주가 등락, score: 1, desc: "단순한 주가 오르내림, 증시 반응"}
    - {name: 칼럼·인터뷰, score: 1, desc: "칼럼, 사설, 인터뷰, 기고"}
  # 가감점
  adjust:
    watch_company: 1     # 아래 관심 기업이 사건의 직접 당사자이면
    wide_coverage: 1     # 서로 다른 매체 wide_coverage_sources곳 이상이 보도하면
    unconfirmed: -1      # 검토·추진·협상 중이거나 전망·루머처럼 공식 확인이 없는 사건이면
  wide_coverage_sources: 3
  # 관심 기업: 사건의 직접 당사자이면 +1점 (아래 '기업 이름 사전'의 대표 이름, 판단 근거에도 이 순서로 표시)
  watch_companies:
    - LG디스플레이
    - 삼성디스플레이
    - 삼성전자
    - SK하이닉스
    - 엔비디아

