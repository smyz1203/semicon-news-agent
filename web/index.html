<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 개인용 브리핑 페이지: 검색엔진에 노출하지 않음 -->
  <meta name="robots" content="noindex, nofollow">
  <title>반도체·디스플레이 뉴스 브리핑</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231c2b3a'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23e8c547'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="4" class="mark-ground"/>
          <rect x="9" y="9" width="14" height="14" class="mark-die"/>
          <path d="M5 12h4M5 16h4M5 20h4M23 12h4M23 16h4M23 20h4M12 5v4M16 5v4M20 5v4M12 23v4M16 23v4M20 23v4" class="mark-pins"/>
        </svg>
        <span>칩앤패널 브리핑</span>
      </a>
      <span id="freshness" class="freshness"></span>
    </div>
  </header>

  <div id="stale" class="stale" hidden></div>

  <main class="page">
    <section class="intro">
      <h1>반도체·디스플레이 뉴스</h1>
      <p id="pipeline" class="lede"></p>
    </section>

    <section class="controls" aria-label="필터">
      <div class="control-row">
        <div class="segmented" id="period" role="group" aria-label="기간">
          <button data-value="1">오늘</button>
          <button data-value="3" class="on">3일</button>
          <button data-value="7">7일</button>
          <button data-value="30">30일</button>
        </div>
        <div class="segmented" id="region" role="group" aria-label="지역">
          <button data-value="all" class="on">전체</button>
          <button data-value="ko">국내</button>
          <button data-value="en">해외</button>
        </div>
        <label class="select">
          <span class="sr-only">중요도</span>
          <select id="importance">
            <option value="0">모든 중요도</option>
            <option value="3">3점 이상</option>
            <option value="4">4점 이상</option>
          </select>
        </label>
        <label class="search">
          <span class="sr-only">검색</span>
          <input id="query" type="search" placeholder="기업, 기술, 키워드 검색" autocomplete="off">
        </label>
      </div>
      <div class="chips" id="categories" role="group" aria-label="카테고리"></div>
    </section>

    <section id="top" class="top-issues" aria-labelledby="top-title">
      <h2 id="top-title">주요 이슈</h2>
      <div id="top-list" class="top-grid"></div>
    </section>

    <section aria-labelledby="all-title">
      <h2 id="all-title">전체 이슈 <span id="count" class="count"></span></h2>
      <div id="timeline"></div>
      <p id="empty" class="empty" hidden>조건에 맞는 이슈가 없습니다. 기간을 늘리거나 필터를 풀어 보세요.</p>
    </section>

    <section class="ops" aria-label="운영 상태">
      <div class="ops-block">
        <h2>수집 매체</h2>
        <ul id="sources" class="source-list"></ul>
      </div>
      <div class="ops-block">
        <h2>최근 실행</h2>
        <table class="runs">
          <thead><tr><th>시각</th><th>관련 기사</th><th>새 이슈</th><th>요약</th><th>비용</th></tr></thead>
          <tbody id="runs"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>요약과 중요도는 AI(<span id="ai-name">언어 모델</span>)가 작성했으며 틀릴 수 있습니다. 판단 전에 원문을 확인하세요.</p>
    <p>기사의 저작권은 각 언론사에 있습니다. 이 페이지는 제목과 원문 링크, 자체 작성한 요약만 보여줍니다.</p>
  </footer>

  <script>window.BUILD = "__BUILD__";</script>
  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
